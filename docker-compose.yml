# 本地开发依赖：MySQL + Redis
# 启动：docker compose up -d
# 停止：docker compose down
# 停并删数据：docker compose down -v

services:
  mysql:
    image: mysql:8.4
    container_name: java-demo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: java_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: java-demo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 本地学习环境不加密码；需要时可改为：redis-server --requirepass demo
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
